<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rustfmt.toml generator</title>
    <meta
      name="description"
      content="Build a rustfmt.toml option by option, see what each option does to real Rust code, then copy or download the file."
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('rustfmt-generator:theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
